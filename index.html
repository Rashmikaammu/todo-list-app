<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <p>Organize your day, one task at a time!</p>

        <form id="task-form">
            <input type="text" id="task-input"
                   placeholder="Enter a new task..." required>
            <button type="submit">Add Task</button>
        </form>

        <div class="filters">
            <button type="button" data-filter="all">All</button>
            <button type="button" data-filter="active">Active</button>
            <button type="button" data-filter="completed">Completed</button>
        </div>

        <p id="task-count">0 tasks left</p>
        <ul id="task-list"></ul>
        <p id="empty-message">No tasks yet. Add your first task!</p>

        <button type="button" id="clear-completed">
            Clear Completed
        </button>
    </div>
</body>
</html>
